<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop Reader</title>
<meta name="description" content="Phonics and reading practice built around engineering, robotics, and making things.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Lexend is optional: if school IT blocks Google Fonts, the system fallbacks below take over. -->
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
<style>
  :root {
    --bg: #0e2944;
    --grid: rgba(150, 200, 255, .07);
    --panel: #163b60;
    --panel-2: #1d4a75;
    --line: #2d5f8f;
    --ink: #eef5ff;
    --muted: #a9c1dc;
    --accent: #ffc93c;
    --accent-ink: #2a1f00;
    --ok: #3ddc97;
    --bad: #ff7070;
    /* decoder colors */
    --c-v: #ff9a5c;      /* short vowel */
    --c-long: #ffd25c;   /* long vowel (magic e) */
    --c-c: #7cc4ff;      /* consonant */
    --c-dig: #c79bff;    /* digraph */
    --c-team: #ff8ad1;   /* vowel team */
    --c-r: #5fe0c8;      /* bossy r */
    --c-silent: #6f86a3;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: 'Lexend', 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    min-height: 100vh;
  }
  button, input { font: inherit; color: inherit; }
  h1 { font-size: clamp(26px, 5vw, 38px); margin: .2em 0 .4em; line-height: 1.2; }
  h2 { font-size: 22px; margin: 1.4em 0 .6em; color: var(--accent); letter-spacing: .02em; }
  h2 small, h3 small { color: var(--muted); font-weight: 400; font-size: 15px; margin-left: 8px; }
  h3 { font-size: 18px; margin: 1em 0 .4em; }
  main { max-width: 980px; margin: 0 auto; padding: 16px 16px 60px; }

  .emo { width: 1.2em; height: 1.2em; vertical-align: -0.2em; }
  .emo.sm { width: 26px; height: 26px; }
  .emo.md { width: 44px; height: 44px; }
  .emo.lg { width: 84px; height: 84px; }
  .emo.xl { width: 120px; height: 120px; }
  .emo-txt { display: inline-block; font-size: 1em; line-height: 1; }
  /* Pictures sit on a light tile so dark emoji (hat, chain, hole...) stay visible on the blueprint blue. */
  .emo.md, .emo.lg, .emo.xl, .part .emo, .emo-txt.md, .emo-txt.lg, .emo-txt.xl {
    background: #eef4fb; border: 2px solid #c9d8ea; border-radius: 18%; padding: 8%;
    box-shadow: 0 2px 0 rgba(0, 0, 0, .25);
  }
  .emo-txt.md, .emo-txt.lg, .emo-txt.xl { padding: .1em; }
  .part .emo { border-radius: 8px; padding: 3px; border-width: 1px; box-shadow: none; }
  .emo-txt.sm { font-size: 24px; } .emo-txt.md { font-size: 40px; } .emo-txt.lg { font-size: 76px; } .emo-txt.xl { font-size: 110px; }

  /* top bar */
  .top {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: rgba(10, 32, 54, .92);
    border-bottom: 2px solid var(--line); backdrop-filter: blur(6px);
  }
  .brand { font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .top-title { flex: 1; text-align: center; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gauge { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .g-bar { width: 90px; height: 14px; border-radius: 8px; background: #0a1e33; border: 2px solid var(--line); overflow: hidden; }
  .g-bar span { display: block; height: 100%; transition: width .4s; }
  .gauge.hi .g-bar span { background: var(--ok); }
  .gauge.mid .g-bar span { background: var(--accent); }
  .gauge.lo .g-bar span { background: var(--bad); }
  .g-num { min-width: 3ch; font-variant-numeric: tabular-nums; }

  /* buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; justify-content: center;
    padding: 10px 18px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--panel-2); cursor: pointer; font-weight: 600;
    transition: transform .08s, background .15s;
  }
  .btn:hover { background: var(--line); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { background: #ffd866; }
  .btn.ghost { background: transparent; }
  .btn.small { padding: 6px 12px; font-size: 15px; }
  .btn.mini { padding: 4px 10px; font-size: 15px; border-radius: 10px; }
  .btn.radio { border-color: #8a6b1d; }
  .btn.danger { border-color: var(--bad); color: var(--bad); }
  .btn.speak { margin: 4px 0 12px; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius); padding: 22px; margin: 16px 0; }
  .center { text-align: center; }
  .tip { color: var(--muted); font-size: 15px; }

  /* home */
  .hello h1 { margin-top: 8px; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin: 12px 0; }
  .hello .stats { justify-content: flex-start; }
  .stat { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 10px 18px; min-width: 130px; }
  .stat b { display: block; font-size: 30px; color: var(--accent); line-height: 1.1; }
  .stat span { color: var(--muted); font-size: 14px; }
  .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .proj { background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .proj-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  .proj-head small { display: block; color: var(--muted); }
  .parts { display: flex; flex-wrap: wrap; gap: 8px; }
  .part { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 74px; padding: 6px 2px; border-radius: 10px; border: 2px dashed var(--line); font-size: 12px; text-align: center; color: var(--muted); }
  .part .emo, .part .emo-txt { filter: grayscale(1) opacity(.35); }
  .part.have { border-style: solid; border-color: var(--ok); color: var(--ink); background: rgba(61, 220, 151, .08); }
  .part.have .emo, .part.have .emo-txt { filter: none; }
  .levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .lvl { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); cursor: pointer; }
  .lvl:hover:not([disabled]) { background: var(--panel-2); }
  .lvl.locked { opacity: .45; cursor: default; }
  .lvl.done { border-color: var(--ok); }
  .lvl.open:not(.done) { border-color: var(--accent); }
  .lvl-num { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); font-weight: 800; flex: none; }
  .lvl-body { flex: 1; }
  .lvl-body small { display: block; color: var(--muted); }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 30px; color: var(--muted); font-size: 14px; }

  /* level page */
  .pattern { background: var(--panel); border-left: 6px solid var(--accent); border-radius: 12px; padding: 14px 18px; }
  .pattern p { margin: 0 0 8px; font-size: 20px; }
  .tiles { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .tile { display: flex; flex-direction: column; align-items: center; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); cursor: pointer; min-width: 92px; }
  .tile b { font-size: 34px; line-height: 1.1; }
  .tile small { color: var(--muted); }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .ex { font-size: 26px; padding: 6px 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 600; }
  .tricky .hw { display: flex; flex-wrap: wrap; gap: 8px; }
  .hwb { font-size: 22px; padding: 4px 14px; border-radius: 999px; border: 2px solid #b0466e; background: rgba(255, 112, 160, .1); cursor: pointer; }
  .acts { display: grid; gap: 10px; }
  .act { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); cursor: pointer; }
  .act:hover { background: var(--panel-2); }
  .act.ok { border-color: var(--ok); }
  .act-body { flex: 1; } .act-body small { display: block; color: var(--muted); }
  .act-score { font-weight: 800; color: var(--accent); white-space: nowrap; }
  .reward { margin-top: 18px; color: var(--muted); }

  /* play */
  .prog { display: flex; gap: 4px; margin: 6px 0 4px; }
  .prog span { flex: 1; height: 8px; border-radius: 4px; background: var(--panel-2); }
  .prog .p-done { background: var(--ok); }
  .prog .p-now { background: var(--accent); }
  .ask { font-size: 22px; margin: 10px 0; }
  .ask.big { font-size: 28px; font-weight: 600; }
  .big-letter { font-size: 60px; font-weight: 800; color: var(--accent); padding: 0 .2em; }
  .big-letter.huge { display: block; font-size: clamp(110px, 22vw, 180px); line-height: 1; }
  .big-word { font-size: clamp(54px, 12vw, 104px); font-weight: 800; letter-spacing: .03em; margin: 8px 0 12px; line-height: 1.1; word-break: break-word; }
  .big-word.sm { font-size: 44px; }
  .typeform { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .answer { font-size: 36px; padding: 8px 16px; width: min(420px, 100%); border-radius: 12px; border: 3px solid var(--line); background: #0a1e33; text-align: center; letter-spacing: .08em; }
  .answer.short { width: 140px; }
  .answer:focus { border-color: var(--accent); outline: none; }
  .blanks { display: flex; gap: 8px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
  .blanks span { width: 44px; height: 54px; border-bottom: 4px solid var(--muted); font-size: 36px; font-weight: 800; display: grid; place-items: center; }
  .blanks span.filled { border-color: var(--accent); }
  .copy { background: rgba(255, 201, 60, .08); border: 2px dashed var(--accent); border-radius: 12px; padding: 10px; margin: 10px auto; max-width: 600px; }
  .choices { display: grid; gap: 12px; margin: 16px auto 0; max-width: 760px; }
  .choices.pics { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .choices.words { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .choices.defs { grid-template-columns: 1fr; max-width: 640px; }
  .pic-wrap { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .choice {
    position: relative; border-radius: 16px; border: 3px solid var(--line); background: var(--panel-2);
    cursor: pointer; padding: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 100%;
  }
  .choice:hover:not([disabled]) { border-color: var(--accent); }
  .choice[disabled] { cursor: default; }
  .choice.word { font-size: clamp(30px, 6vw, 44px); font-weight: 800; }
  .choice.def { font-size: 22px; text-align: left; align-items: flex-start; padding-left: 52px; min-height: 64px; }
  .choice.pic { min-height: 130px; }
  .choice small { color: var(--muted); font-size: 16px; }
  .choice.is-right { border-color: var(--ok); background: rgba(61, 220, 151, .15); }
  .choice.is-wrong { border-color: var(--bad); background: rgba(255, 112, 112, .15); }
  .kbd { position: absolute; top: 8px; left: 10px; font-size: 14px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
  .helpers { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 12px 0; }
  .fb { margin-top: 18px; font-size: 22px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .fb.right { color: var(--ok); }
  .fb.wrong { color: var(--bad); }
  .fb .decoder { color: var(--ink); }

  /* decoder */
  .decoder { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 10px 0 4px; }
  .syl { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(0, 0, 0, .18); }
  .chunk { font-size: clamp(30px, 6vw, 46px); font-weight: 800; min-width: 54px; padding: 4px 12px; border-radius: 10px; border: 2px solid currentColor; background: rgba(0, 0, 0, .15); cursor: pointer; }
  .k-v { color: var(--c-v); } .k-long { color: var(--c-long); } .k-c { color: var(--c-c); }
  .k-dig { color: var(--c-dig); } .k-team { color: var(--c-team); } .k-r { color: var(--c-r); }
  .k-silent { color: var(--c-silent); border-style: dashed; } .k-x { color: var(--ink); }

  /* mission */
  .mission h2 { margin-top: 0; }
  .story p { font-size: clamp(22px, 4.2vw, 32px); line-height: 1.7; margin: 6px 0; }
  .story .past { color: var(--muted); font-size: 18px; line-height: 1.5; }
  .story .now { background: rgba(0, 0, 0, .15); border-radius: 12px; padding: 8px 12px; }
  .tok { background: none; border: none; padding: 0 1px; cursor: pointer; border-radius: 6px; font-weight: 600; }
  .tok:hover { background: rgba(255, 201, 60, .18); }
  .tok.preview, .preview-key { border-bottom: 3px dotted var(--c-r); }
  .tok.sel { background: rgba(255, 201, 60, .3); }
  .popdec { background: var(--bg); border-radius: 12px; padding: 10px; text-align: center; }

  /* results + overlay */
  .score { font-size: 26px; font-weight: 600; }
  .missed { color: var(--muted); }
  .overlay { position: fixed; inset: 0; background: rgba(4, 14, 26, .82); display: grid; place-items: center; z-index: 20; padding: 16px; }
  .celebrate { max-width: 520px; border-color: var(--accent); animation: pop .35s ease-out; }
  .newpart { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 10px 0; }
  .newpart b { font-size: 26px; } .newpart small { color: var(--muted); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 140%); background: var(--accent); color: var(--accent-ink); padding: 12px 20px; border-radius: 12px; font-weight: 600; max-width: calc(100% - 32px); transition: transform .25s; z-index: 30; }
  #toast.show { transform: translate(-50%, 0); }

  /* word-by-word highlight while reading aloud */
  .w { border-radius: 6px; transition: background .08s, color .08s; }
  .hl, .tok.hl { background: var(--accent) !important; color: var(--accent-ink) !important; box-shadow: 0 0 0 3px var(--accent); }
  .big-word.hl { background: none !important; box-shadow: none; color: var(--accent) !important; text-shadow: 0 0 18px rgba(255, 201, 60, .6); }
  .decoder.hl { background: none !important; box-shadow: none; }
  .decoder.hl .chunk { background: rgba(255, 201, 60, .3); }
  .tile.hl small, .tile.hl b { color: var(--accent-ink); }

  /* droid */
  .droid { display: block; }
  .droid.sm { width: 120px; height: 192px; }
  .droid.md { width: 130px; height: 208px; }
  .droid.lg { width: 160px; height: 256px; margin: 0 auto; }
  .droid .shell, .droid .pauldron, .droid .foot, .droid .hand, .droid g.on rect, .droid g.limbs.on rect, .droid g.limbs.on .joint { fill: url(#dmSil); stroke: #2b3442; stroke-width: 2.2; }
  .droid .dark, .droid .cheek, .droid .ab, .droid g.on .knee, .droid .eyes .socket { fill: url(#dmGun); stroke: #1f2630; stroke-width: 2.2; }
  .droid .chest { fill: url(#dmBlue); stroke: #12366f; stroke-width: 2.5; }
  .droid .seam { fill: none; stroke: rgba(20, 30, 45, .5); stroke-width: 1.6; }
  .droid .wire { fill: none; stroke-width: 2.4; stroke-linecap: round; }
  .droid .w1 { stroke: #ff7a59; } .droid .w2 { stroke: #5fd3ff; }
  .droid g.on line, .droid .antenna.on line { stroke: #2b3442; stroke-width: 2; }
  .droid.gold .shell, .droid.gold .pauldron, .droid.gold .foot, .droid.gold .hand, .droid.gold g.limbs.on rect, .droid.gold g.limbs.on .joint { fill: url(#dmGold); stroke: #6b4a0c; }
  .droid.gold .chest { fill: url(#dmBlue); } /* chest stays blue even with gold plating */
  .droid g.ghost * { fill: rgba(169, 193, 220, .05) !important; stroke: #a9c1dc !important; stroke-width: 2; stroke-dasharray: 5 4; filter: none !important; }
  .droid .eyes.on circle:not(.socket):not(.glint) { fill: url(#dmEye); stroke: #8a5600; stroke-width: 1.5; filter: drop-shadow(0 0 6px #ffd54a); animation: glow 2.4s ease-in-out infinite; }
  .droid .eyes.on .glint { fill: #fff; stroke: none; filter: none; }
  .droid .eyes.on .socket { fill: #1a222c; stroke: #4a5564; }
  .droid .voice.on rect { fill: #1f2630; stroke: #8f9aa8; }
  .droid .voice.on line { stroke: #6ff0ff; }
  .droid .core.on circle:first-child { fill: url(#dmGun); stroke: #1f2630; }
  .droid .core.on .light { fill: #6ff0ff; stroke: none; filter: drop-shadow(0 0 6px #6ff0ff); animation: glow 1.8s ease-in-out infinite; }
  .droid .antenna.on .tip { fill: #ff5a5a; stroke: #7a1010; filter: drop-shadow(0 0 5px #ff5a5a); animation: glow 1.2s steps(2) infinite; }
  .droid .bob { animation: bob 3.2s ease-in-out infinite; transform-origin: 100px 320px; }
  .droid.talking .eyes.on circle:not(.socket):not(.glint) { animation: blink 1.6s infinite; }
  .droid.talking .voice.on line { animation: glow .4s steps(2) infinite; }
  .droid.sm { width: 130px; height: 221px; }
  .droid.md { width: 160px; height: 272px; }
  .droid.lg { width: 180px; height: 306px; margin: 0 auto; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: .65; } }
  @keyframes blink { 0%, 90%, 100% { opacity: 1; } 94% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { .droid *, .tile, .choice { animation: none !important; } }
  .droid-panel { display: flex; gap: 20px; align-items: center; background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px 20px; margin-top: 16px; }
  .droid-btn { background: none; border: none; padding: 0; cursor: pointer; }
  .droid-info { flex: 1; }
  .droid-info h2 { margin: 0 0 4px; }
  .droid-info p { margin: 4px 0; }
  .meter { height: 12px; border-radius: 6px; background: #0a1e33; border: 2px solid var(--line); overflow: hidden; max-width: 360px; }
  .meter span { display: block; height: 100%; background: var(--accent); }
  .dparts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .dparts span { font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 1px dashed var(--line); color: var(--muted); }
  .dparts span.have { border: 1px solid var(--ok); color: var(--ink); background: rgba(61, 220, 151, .1); }
  .droid-row { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .bubble { position: relative; background: var(--bg); border: 2px solid var(--line); border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .bubble::before { content: ''; position: absolute; left: -12px; top: 24px; border: 10px solid transparent; border-right-color: var(--line); border-left: 0; }
  .choices.judge { grid-template-columns: 1fr 1fr; max-width: 520px; }
  .choice.judge-yes, .choice.judge-no { font-size: 28px; font-weight: 800; min-height: 90px; }
  .big-btn { font-size: 22px; padding: 14px 26px; }
  .bubble { max-width: 360px; text-align: left; }
  .accent { color: var(--accent); }
  .claim { display: flex; align-items: center; justify-content: center; gap: 22px; flex-wrap: wrap; margin: 10px 0; }
  .claim-label { display: block; font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .claim-letter { display: flex; flex-direction: column; align-items: center; }
  .claim-part { display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--panel-2); border: 3px solid var(--line); border-radius: 18px; padding: 14px 18px; }
  .claim-says { font-size: 24px; color: var(--muted); }
  .claim .big-letter.huge { display: inline-block; }
  .fb-line { margin: 0; max-width: 640px; }
  .fb-icon { margin-right: 4px; }
  .fb-pics { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
  .fb-pic { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 18px; color: var(--ink); }
  .fb-pic.no .emo { opacity: .55; border-color: var(--bad); }
  .fb-pic.ok .emo { border-color: var(--ok); border-width: 3px; }
  .fb .big-letter.huge { color: var(--accent); }
  .pic-main { display: inline-block; border-radius: 22px; }
